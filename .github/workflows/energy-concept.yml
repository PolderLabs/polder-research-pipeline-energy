name: Energy concept checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  energy-concept:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install existing toolchain and package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Check energy module formatting and focused regressions
        run: |
          ruff check src/polder_research/energy.py tests/test_energy.py
          ruff format --check src/polder_research/energy.py tests/test_energy.py
          pytest -q tests/test_energy.py
      - name: Exercise installed CLI with synthetic inputs only
        run: |
          polder-energy --root "$RUNNER_TEMP/energy-smoke" demo demo-single --phases 1
          polder-energy --root "$RUNNER_TEMP/energy-smoke" build demo-single
          polder-energy --root "$RUNNER_TEMP/energy-smoke" build demo-single
          polder-energy --root "$RUNNER_TEMP/energy-smoke" demo demo-three --phases 3
          polder-energy --root "$RUNNER_TEMP/energy-smoke" build demo-three
          polder-energy --root "$RUNNER_TEMP/energy-smoke" init unknown-customer
          if polder-energy --root "$RUNNER_TEMP/energy-smoke" build unknown-customer; then
            echo 'Unknown customer scenario must not build successfully' >&2
            exit 1
          fi
