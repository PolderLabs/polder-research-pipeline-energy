name: Energy concept checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  energy-concept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install existing toolchain and package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
      - name: Focused energy tests and synthetic bundle smoke check
        run: |
          pytest -q tests/test_energy.py
          polder-energy --root "$RUNNER_TEMP/energy-smoke" demo demo-single --phases 1
          polder-energy --root "$RUNNER_TEMP/energy-smoke" build demo-single
          polder-energy --root "$RUNNER_TEMP/energy-smoke" demo demo-three --phases 3
          polder-energy --root "$RUNNER_TEMP/energy-smoke" build demo-three
      - name: Show formatter and generated-status changes for review
        run: |
          ruff format src/polder_research/energy.py tests/test_energy.py
          python scripts/emit_implementation_status.py
          git diff -- src/polder_research/energy.py tests/test_energy.py knowledge-base/AUDIT.md
      - name: Require clean generated files and formatting
        run: |
          ruff check src/polder_research/energy.py tests/test_energy.py
          git diff --exit-code -- src/polder_research/energy.py tests/test_energy.py knowledge-base/AUDIT.md
