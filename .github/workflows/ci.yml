name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults: every job that does not override `permissions`
# inherits this read-only token (AUDIT.md §42 — minimum workflow permissions).
permissions:
  contents: read

jobs:
  lint:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install pinned CI toolchain
        run: python -m pip install -r requirements-ci.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  syntax-compat:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Python 3.13 syntax compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile source, scripts, and tests
        run: python -m compileall -q src scripts tests

  test:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Test (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install pinned CI toolchain
        run: python -m pip install -r requirements-ci.txt
      - name: Install package editable
        run: python -m pip install -e .
      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest -v

  wheel-smoke:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Wheel installation smoke check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build and install wheel outside checkout
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/polder-wheelhouse"
          environment="$RUNNER_TEMP/polder-wheel-environment"
          expected_schema_count=$(find "$GITHUB_WORKSPACE/schemas" -maxdepth 1 -name '*.schema.json' -type f | wc -l)
          test "$expected_schema_count" -gt 0
          python -m pip wheel --no-deps --wheel-dir "$wheelhouse" .
          python -m venv "$environment"
          "$environment/bin/python" -m pip install "$wheelhouse"/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$environment/bin/polder-research" --help
          env -u PYTHONPATH "$environment/bin/python" -c "from polder_research.schemas import package_registry; count = len(package_registry().names()); assert count == $expected_schema_count, (count, $expected_schema_count); print(f'Loaded {count} packaged schemas')"
          env -u PYTHONPATH "$environment/bin/polder-research" --root "$GITHUB_WORKSPACE" state-build
          env -u PYTHONPATH "$environment/bin/polder-research" --root "$GITHUB_WORKSPACE" health-build
          env -u PYTHONPATH "$environment/bin/polder-research" --root "$GITHUB_WORKSPACE" intake-register --list
          env -u PYTHONPATH "$environment/bin/polder-research" --root "$GITHUB_WORKSPACE" new-note --domain 02-research --title "Wheel smoke check" --dry-run
          env -u PYTHONPATH "$environment/bin/polder-research" --root "$GITHUB_WORKSPACE" vault-audit
          env -u PYTHONPATH "$environment/bin/polder-research" --root "$GITHUB_WORKSPACE" frontmatter-fix
          # The commands above run against a checkout, which supplies skills/.
          # A pip-installed user has no checkout, so prove the packaged copies
          # resolve and both commands run against a workspace without skills/.
          env -u PYTHONPATH "$environment/bin/python" -c "from polder_research.paths import BUNDLED_SKILLS_DIR as d; import sys; names=('vault_audit.py','frontmatter_fix.py'); missing=[n for n in names if not (d/n).is_file()]; assert not missing, (str(d), missing); print(f'Packaged skill scripts present: {d}')"
          bare="$RUNNER_TEMP/polder-bare-workspace"
          mkdir -p "$bare"
          cp -r "$GITHUB_WORKSPACE/schemas" "$bare/schemas"
          mkdir -p "$bare/knowledge-base"
          cp "$GITHUB_WORKSPACE/knowledge-base/research.config.yaml" "$bare/knowledge-base/"
          mkdir -p "$bare/knowledge-base/90-inbox/processing"
          printf '# Wheel smoke fixture\n' > "$bare/knowledge-base/90-inbox/processing/wheel-smoke.md"
          printf '%s\n' '---' 'type: index' 'status: current' 'tags:' '  - smoke-test' '---' '# Wheel smoke workspace' '' '[[90-inbox/processing/wheel-smoke]]' > "$bare/knowledge-base/index.md"
          test ! -d "$bare/skills"
          if ( cd "$bare" && env -u PYTHONPATH "$environment/bin/polder-research" vault-audit ); then
            echo "vault-audit unexpectedly accepted invalid frontmatter" >&2
            exit 1
          fi
          ( cd "$bare" && env -u PYTHONPATH "$environment/bin/polder-research" frontmatter-fix --apply )
          grep -q '^type: inbox$' "$bare/knowledge-base/90-inbox/processing/wheel-smoke.md"
          ( cd "$bare" && env -u PYTHONPATH "$environment/bin/polder-research" vault-audit )

  vault-audit:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Vault audit (clean = exit 0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install pinned CI toolchain
        run: python -m pip install -r requirements-ci.txt
      - name: Install package editable
        run: python -m pip install -e .
      - name: Vault audit
        env:
          PYTHONPATH: src
        run: python3 skills/obsidian-knowledgebase-curator/scripts/vault_audit.py

  schema-validate:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Schema validation and generated state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install pinned CI toolchain
        run: python -m pip install -r requirements-ci.txt
      - name: Install package editable
        run: python -m pip install -e .
      - name: Validate role manifests
        run: |
          python3 -c "
          import yaml
          from pathlib import Path
          base = Path('agents/roles')
          for p in sorted(base.glob('*.yaml')):
              manifest = yaml.safe_load(p.read_text())
              assert manifest['schema_version'] == 1, p
              assert manifest['role'] == p.stem, p
              print(f'OK: {p}')
          print('All role manifests valid')
          "
      - name: Validate research.config.yaml
        run: |
          python3 -c "
          import yaml
          c = yaml.safe_load(open('knowledge-base/research.config.yaml'))
          assert c['schema_version'] == 1
          print('OK: research.config.yaml')
          "
      - name: Validate JSON schemas parse
        run: |
          python3 -c "
          import json
          from pathlib import Path
          for p in sorted(Path('schemas').glob('*.schema.json')):
              json.loads(p.read_text())
              print(f'OK: {p}')
          print('All schemas valid JSON')
          "
      - name: Generated-state deterministic smoke check
        run: |
          set -euo pipefail
          python3 scripts/generate_derived.py
          before=$(sha256sum .research/generated/state.json .research/generated/health.json)
          python3 scripts/generate_derived.py
          after=$(sha256sum .research/generated/state.json .research/generated/health.json)
          if [ "$before" != "$after" ]; then
            echo '::error::Generated state is not deterministic' >&2
            exit 1
          fi

  secret-scan:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history
        run: "$(go env GOPATH)/bin/gitleaks git --redact --no-banner"
  implementation-status:
    if: github.repository == 'PolderLabs/polder-research-pipeline'
    name: Implementation status block
    # AUDIT.md §27 — machine-verified status block. Runs after every other
    # CI job so the test count reflects what CI actually exercised. Emits
    # the block; the drift is then checked against the committed copy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [lint, syntax-compat, test, wheel-smoke, vault-audit, schema-validate, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements-ci.txt"
      - name: Upgrade pip
        run: python -m pip install -U pip
      - name: Install pinned CI toolchain
        run: python -m pip install -r requirements-ci.txt
      - name: Install package editable
        run: python -m pip install -e .
      - name: Emit and verify status block
        run: |
          set -euo pipefail
          python3 scripts/emit_implementation_status.py
          if ! git diff --exit-code -- knowledge-base/AUDIT.md; then
            echo '::error::knowledge-base/AUDIT.md status block drift detected.' >&2
            echo 'Run: python3 scripts/emit_implementation_status.py && git add knowledge-base/AUDIT.md' >&2
            exit 1
          fi
