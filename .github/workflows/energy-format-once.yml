name: Workbench branch maintenance (temporary)

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  maintain:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/energy-engineering-workbench'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Apply repository formatting and regenerate tracked status
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .
          ruff check --fix src/polder_research/energy.py tests/test_energy.py
          ruff format src/polder_research/energy.py tests/test_energy.py
          python scripts/emit_implementation_status.py
          pytest -q tests/test_energy.py
          ruff check src/polder_research/energy.py tests/test_energy.py
          ruff format --check src/polder_research/energy.py tests/test_energy.py
      - name: Commit only formatting and generated status on the workbench branch
        run: |
          set -euo pipefail
          git add -- src/polder_research/energy.py tests/test_energy.py knowledge-base/AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply repository formatter and regenerate implementation status'
          git push origin HEAD:refs/heads/feat/energy-engineering-workbench
