[project]
name = "polder-research-pipeline"
version = "0.3.0"
description = "Repository-native framework for structured, agent-driven research."
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [{name = "Polder Labs"}]
classifiers = ["Development Status :: 3 - Alpha"]

dependencies = [
    "jsonschema>=4.17",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
laya = ["laya==0.3.20"]
jev = ["typesafe-sdk==0.7.1"]

[project.scripts]
polder-research = "polder_research.scripts:main"
polder-energy = "polder_research.energy:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polder_research"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "polder_research/_bundled/schemas"
"skills/obsidian-knowledgebase-curator/scripts/vault_audit.py" = "polder_research/_bundled/skills/vault_audit.py"
"skills/obsidian-knowledgebase-curator/scripts/frontmatter_fix.py" = "polder_research/_bundled/skills/frontmatter_fix.py"

[tool.pytest.ini_options]
